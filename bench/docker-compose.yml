services:
  postgres-bench:
    image: postgres:16-alpine
    container_name: kanbex-postgres-bench
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench_secret
      POSTGRES_DB: kanbex_bench
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bench -d kanbex_bench']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-bench:
    image: redis:7-alpine
    container_name: kanbex-redis-bench
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
